name: Giant JSON benchmark

'on':
  workflow_dispatch:
    inputs:
      baseline:
        description: '比較元のコミットSHA（40桁）'
        type: string
        required: true
      candidate:
        description: '比較先のコミットSHA（40桁）。空欄は選択したブランチ、同じSHAならA/A比較'
        type: string
        required: false
      dotnet_migration:
        description: '.NET 10 → .NET 11 migration pair only (6fc08f9 → 2c7bd11)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  compare:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      BASELINE_SHA: ${{ inputs.baseline }}
      CANDIDATE_SHA: ${{ inputs.candidate || github.sha }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Validate revisions and use the Windows sample line endings
        run: |
          foreach ($sha in $env:BASELINE_SHA, $env:CANDIDATE_SHA) {
            if ($sha -notmatch '\A[0-9a-fA-F]{40}\z') { throw 'Enter a full 40-digit commit SHA.' }
          }
          git config --global core.autocrlf true

      - name: Check out the comparison tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          sparse-checkout: |
            scripts/benchmarks
          persist-credentials: false

      - name: Check out baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: baseline
          ref: ${{ env.BASELINE_SHA }}
          persist-credentials: false

      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Install baseline SDK for the migration comparison
        if: ${{ inputs.dotnet_migration }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: baseline/global.json

      - name: Install candidate SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: candidate/global.json

      - name: Verify the parses and measure four alternating pairs
        run: |
          $arguments = @{ Baseline = 'baseline'; Candidate = 'candidate'; OutputDirectory = "$env:RUNNER_TEMP/json-results" }
          if ('${{ inputs.dotnet_migration }}' -eq 'true') { $arguments.DotNetMigration = $true }
          ./control/scripts/benchmarks/Compare-GiantJson.ps1 @arguments
          Get-Content -Raw -Encoding utf8 "$env:RUNNER_TEMP/json-results/summary.md" >> $env:GITHUB_STEP_SUMMARY

      - name: Save logs and results (including failed comparisons)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: giant-json-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/json-results
          retention-days: 14
          if-no-files-found: warn
